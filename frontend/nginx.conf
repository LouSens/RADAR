# Serves the built app and forwards API calls, including the live WebSocket, to the API
# container, so the browser talks to a single origin.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Client-side routes such as /asset/btc-usd all load the app shell.
    location / {
        try_files $uri /index.html;
    }
}
