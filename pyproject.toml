[project]
name = "radar"
version = "0.1.0"
description = "RADAR: a market outlook app for Bitcoin and gold. Analytics only; it never places trades."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "structlog>=26.1.0",
    "websockets>=17.2",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "S", "T20", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]
"backend/scripts/build_notebook.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests", "backend/scripts"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "exchange_calendars", "exchange_calendars.*", "apscheduler.*", "nbformat", "nbformat.*", "nbconvert", "nbconvert.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Jupyter's libraries ship without type hints.
module = ["build_notebook"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
