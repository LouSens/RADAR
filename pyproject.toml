[project]
name = "radar"
version = "0.1.0"
description = "RADAR: a market outlook app for Bitcoin and gold. Analytics only; it never places trades."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "websockets>=17.2",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "S", "T20", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
