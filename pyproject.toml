[project]
name = "radar"
version = "0.1.0"
description = "RADAR: a market outlook app for Bitcoin and gold. Analytics only; it never places trades."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.142.2",
    "hmmlearn>=0.3.3",
    "httpx>=0.28.1",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.3",
    "statsmodels>=0.15.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.optional-dependencies]
# The language models for news (Phase 4). Kept out of the default install so the API
# container and CI stay small; install with `uv sync --extra nlp`.
nlp = [
    "torch>=2.6",
    "transformers>=4.50",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/radar"]

# torch comes from the CUDA 12.6 build index, so the models run on an NVIDIA GPU when
# there is one and fall back to the CPU when there is not.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "S", "T20", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests", "backend/scripts"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "exchange_calendars", "exchange_calendars.*", "apscheduler.*", "nbformat", "nbformat.*", "nbconvert", "nbconvert.*", "hmmlearn", "hmmlearn.*", "sklearn", "sklearn.*", "scipy", "scipy.*", "mlflow", "mlflow.*", "statsmodels", "statsmodels.*", "torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional (the nlp extra): treated as untyped whether or not they are installed, so the
# check gives the same result on a laptop with them and in CI without them.
module = ["torch", "torch.*", "transformers", "transformers.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Jupyter's libraries ship without type hints.
module = ["build_notebooks"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
