# The asset universe. This file is configuration: change it here, not in code.
# Set RADAR_UNIVERSE_FILE to load a different file.
#
# The values below follow docs/DATA_AUDIT.md and docs/DECISIONS.md (010).

# Alpaca crypto location used for history and for the live stream.
crypto_location = "us-1"

# Bar timeframes stored for every asset class.
[timeframes]
crypto = ["1Hour", "1Day"]
stock = ["1Day"]

# symbol:       canonical symbol used in the database and the API
# bars_symbol:  symbol on the market data endpoints
# news_symbols: symbols on the news endpoint whose articles count for this asset
# news_start:   first date news for this asset is used in analysis
# history_start: first date bars exist for this asset

[[assets]]
symbol = "BTC/USD"
name = "Bitcoin"
asset_class = "crypto"
is_primary = true
bars_symbol = "BTC/USD"
history_start = 2021-01-01
news_symbols = ["BTCUSD"]
news_start = 2022-01-01

[[assets]]
symbol = "PAXG/USD"
name = "Gold (PAXG)"
asset_class = "crypto"
is_primary = true
bars_symbol = "PAXG/USD"
history_start = 2021-01-01
news_symbols = ["GLD", "IAU", "GDX", "PAXGUSD"]
news_start = 2023-01-01

[[assets]]
symbol = "ETH/USD"
name = "Ethereum"
asset_class = "crypto"
bars_symbol = "ETH/USD"
history_start = 2021-01-01

[[assets]]
symbol = "SOL/USD"
name = "Solana"
asset_class = "crypto"
bars_symbol = "SOL/USD"
history_start = 2021-06-17

[[assets]]
symbol = "SPY"
